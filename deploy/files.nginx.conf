# Self-hosted `files` service (deploy/docker-compose.yml): same URL layout as the production
# files/nginx.conf, minus the StudioMac-only Ollama proxy. Reached only by the app container.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  server {
    listen 8911;
    server_tokens off;

    location /pdf/ {
      alias /data/pdf/;
      add_header Content-Disposition 'inline';
      add_header Cache-Control 'public, max-age=3600';
    }
    location /page/ {
      alias /data/pages/;
      add_header Cache-Control 'public, max-age=86400';
    }
    location /text/ {
      alias /data/text/;
      add_header Cache-Control 'public, max-age=3600';
    }
    location /downloads/ {
      alias /data/downloads/;
      add_header Cache-Control "private, no-store" always;
      add_header Content-Disposition "attachment";
    }
    location / { return 404; }
  }
}
