# Data-plane services for 911records.nyc, run on the STUDIOMAC HOST'S
# docker — NOT Dokploy, and NOT the same compose as docker-compose.yml
# (which is the Dokploy-deployed `app` only; see its header comment for why
# they're split: two Dokploy replicas can't share a bind mount).
#
#   docker compose -f docker-compose.host.yml up -d
#
# Both services publish on all interfaces (see the port comments: OrbStack
# ignores a LAN-IP-specific publish), so StudioMac tools use 127.0.0.1 and the
# two Dokploy replicas use 192.168.200.51. OpenSearch requires basic auth.
#
# ## Cutover from docker-compose.opensearch.yml (dev, security OFF)
#
# docker-compose.opensearch.yml stays as-is for local dev (`sept11-opensearch`,
# no auth, 127.0.0.1 only) — do NOT stop it as a side effect of adding this
# file. When it's time to cut the app over to this one instead:
#   1. `docker compose -f docker-compose.host.yml up -d opensearch` (a new,
#      separate container/volume — it starts empty).
#   2. Re-run the indexer against it with basic auth (plain HTTP — see
#      plugins.security.ssl.http.enabled below, no cert to work around):
#      `OPENSEARCH_URL=http://127.0.0.1:9200 OPENSEARCH_USER=admin \
#       OPENSEARCH_PASSWORD=<the password below> \
#       .venv/bin/python scripts/search/opensearch.py setup && ... index`
#      (scripts/search/opensearch.py doesn't read basic-auth env yet — that's
#      A2's `--host`/basic-auth env work per docs/PLAN.md's workstream table.)
#   3. Point the app's OPENSEARCH_URL/OPENSEARCH_USER/OPENSEARCH_PASSWORD at
#      this instance and redeploy.
#   4. Once confirmed, `docker compose -f docker-compose.opensearch.yml down`
#      and update refresh_daily.sh to index into this one going forward.
# Until that cutover, the app's OPENSEARCH_URL in Dokploy should point at
# whichever instance is actually live — this file existing doesn't move it.
services:
  files:
    image: nginx:1.27-alpine
    volumes:
      - ./data/downloads:/data/downloads:ro
      - ./data/pdf:/data/pdf:ro
      - ./data/pages:/data/pages:ro
      - ./data/text:/data/text:ro
      - ./files/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # 0.0.0.0 on purpose: OrbStack does not honour a publish bound to the
      # host's LAN IP (tested 2026-09-14: 192.168.200.51:8911 answered from
      # nowhere, not even the host). Publishing on all interfaces is what makes
      # the LAN IP reachable from MonsterMac's Dokploy replica. The LAN is
      # private; the data here is the City's public records.
      - '8911:8911'
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      cluster.name: sept11-records
      node.name: sept11-os-1
      # Security plugin ON (unlike docker-compose.opensearch.yml's dev
      # instance) — this one is reachable from the LAN. HTTP-layer TLS is
      # explicitly OFF: this is a LAN-only service behind no real CA, and a
      # self-signed demo cert only pushes the problem onto every client
      # (the app would need NODE_TLS_REJECT_UNAUTHORIZED=0, which quietly
      # disables cert checking for that whole process). Auth is still
      # required — basic auth over plain HTTP on a trusted LAN segment.
      # Internal transport (node-to-node) keeps its demo cert; irrelevant
      # for a single-node cluster.
      plugins.security.ssl.http.enabled: 'false'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?set the OpenSearch admin password}
      OPENSEARCH_JAVA_OPTS: '-Xms2g -Xmx2g'
      bootstrap.memory_lock: 'true'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-host-data:/usr/share/opensearch/data
    ports:
      # 0.0.0.0 for the same OrbStack reason as `files`; basic auth is required.
      - '9200:9200'
    restart: unless-stopped

volumes:
  opensearch-host-data: {}
