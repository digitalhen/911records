# The `files` service (docker-compose.yml). Serves data/pdf and data/pages
# straight from the read-only bind mount at /data. docker-entrypoint.sh
# generates /etc/nginx/maps/bates.map (bates -> "<agency>/<volume>") from
# data/manifest.jsonl before nginx starts, so a request never needs to know
# a document's agency or production volume — the URL is just the Bates
# number. See docs/PLAN.md's URL scheme and web/next.config.ts's rewrite of
# /files/:path* to this service.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  # 24k+ line file; keyed by exact Bates number.
  include /etc/nginx/maps/bates.map;

  server {
    listen 8911;
    server_tokens off;
    client_max_body_size 0;

    # /pdf/<bates>.pdf -> data/pdf/<agency>/<volume>/<bates>.pdf
    # PDFs run up to ~377MB (docs/PLAN.md); sendfile streams them without
    # buffering the whole file in a worker.
    location ~ ^/pdf/(?<bates>[A-Za-z0-9_-]+)\.pdf$ {
      if ($batesdir = "") { return 404; }
      alias /data/pdf/$batesdir/$bates.pdf;
      add_header Content-Disposition 'inline';
      add_header Cache-Control 'public, max-age=3600';
    }

    # /page/<bates>/<n>.webp or <n>.t.webp -> data/pages/<agency>/<volume>/<bates>/<n>(.t).webp
    location ~ ^/page/(?<bates>[A-Za-z0-9_-]+)/(?<n>[0-9]+)(?<thumb>\.t)?\.webp$ {
      if ($batesdir = "") { return 404; }
      alias /data/pages/$batesdir/$bates/$n$thumb.webp;
      add_header Cache-Control 'public, max-age=86400';
    }

    location / { return 404; }
  }
}
