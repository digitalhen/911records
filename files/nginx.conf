# The `files` service (docker-compose.host.yml, runs on StudioMac's HOST
# docker — not inside Dokploy). Serves data/pdf, data/pages and data/text
# straight off disk, plus a proxy to the host's Ollama. URLs carry the
# agency/volume path directly (the app reads that from Postgres via
# lib/site.ts before building a URL — see lib/files.ts), so unlike an
# earlier draft of this file, nginx needs no generated Bates -> path map.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  server {
    listen 8911;
    server_tokens off;
    client_max_body_size 0;

    # /pdf/<agency>/<volume>/<bates>.pdf -> data/pdf/<agency>/<volume>/<bates>.pdf
    # PDFs run up to ~377MB (docs/PLAN.md); sendfile streams them without
    # buffering the whole file in a worker.
    location /pdf/ {
      alias /data/pdf/;
      add_header Content-Disposition 'inline';
      add_header Cache-Control 'public, max-age=3600';
    }

    # /page/<agency>/<volume>/<bates>/<n>.webp or <n>.t.webp
    location /page/ {
      alias /data/pages/;
      add_header Cache-Control 'public, max-age=86400';
    }

    # /text/<agency>/<volume>/<bates>.pages.jsonl / .boxes.jsonl / .ocr.boxes.jsonl
    location /text/ {
      alias /data/text/;
      add_header Cache-Control 'public, max-age=3600';
    }

    # Query embedding (lib/embed.ts) without Ollama listening on the LAN
    # itself — only this nginx does.
    location /ollama/ {
      proxy_pass http://host.docker.internal:11434/;
      proxy_read_timeout 30s;
    }

    # LAN origin only. Public requests go through the current-catalog gate.
    location /downloads/ {
      alias /data/downloads/;
      add_header Cache-Control "private, no-store" always;
      add_header Content-Disposition "attachment";
    }

    location / { return 404; }
  }
}
