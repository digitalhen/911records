<polygon points="644,251 642.0822978455832,247.48966975243852 645.9177021544168,247.48966975243852" fill="#B9C7CD"/>
<rect x="32" y="254" width="232" height="85" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="32" y="254" width="3" height="85" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="44" y="270" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">NLP / LANGUAGE PROCESSING</text>
<text x="44" y="286" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Structured information</text>
<text x="44" y="301" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">Python regex + dictionaries extract addresses,</text>
<text x="44" y="313" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">labs, dates and measurements. Fuzzy matching</text>
<text x="44" y="325" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">resolves names; rules classify record types.</text>
<rect x="280" y="254" width="232" height="85" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="280" y="254" width="3" height="85" rx="1" fill="#235C9D" stroke="none" stroke-width=".7"/>
<text x="292" y="270" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#235C9D">ML</text>
<text x="292" y="286" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Meaning + discovery</text>
<text x="292" y="301" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">Local nomic-embed-text: 768-D vectors from</text>
<text x="292" y="313" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">page chunks. Similarity search, related records</text>
<text x="292" y="325" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">and scikit-learn topic clustering.</text>
<rect x="528" y="254" width="232" height="85" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="528" y="254" width="3" height="85" rx="1" fill="#7451A0" stroke="none" stroke-width=".7"/>
<text x="540" y="270" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#7451A0">LLMs</text>
<text x="540" y="286" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Readable descriptions</text>
<text x="540" y="301" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">Local Qwen: titles and summaries. Claude Haiku:</text>
<text x="540" y="313" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#526773">topic labels, fallback facts and entity cleanup.</text>
<polyline points="148,339 148,351" fill="none" stroke="#B9C7CD" stroke-width="1"/>
<polygon points="148,351 146.08229784558318,347.4896697524385 149.91770215441682,347.4896697524385" fill="#B9C7CD"/>
<polyline points="396,339 396,351" fill="none" stroke="#B9C7CD" stroke-width="1"/>
<polygon points="396,351 394.0822978455832,347.4896697524385 397.9177021544168,347.4896697524385" fill="#B9C7CD"/>
<polyline points="644,339 644,351" fill="none" stroke="#B9C7CD" stroke-width="1"/>
<polygon points="644,351 642.0822978455832,347.4896697524385 645.9177021544168,347.4896697524385" fill="#B9C7CD"/>
<rect x="32" y="355" width="728" height="32" rx="5" fill="#172B37" stroke="none" stroke-width=".7"/>
<text x="44" y="375" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B7DADA">PUBLISH</text>
<text x="100" y="375" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#FFFFFF">PostgreSQL: metadata + text   |   OpenSearch: text + vectors   |   Next.js: two hosts behind Cloudflare</text>
<text x="32" y="411" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#126F70">02  /  SEARCH, EXPLAIN, VERIFY</text>
<polyline points="542,387 542,425" fill="none" stroke="#B9C7CD" stroke-width="1"/>
<polygon points="542,425 540.0822978455832,421.4896697524385 543.9177021544168,421.4896697524385" fill="#B9C7CD"/>
<text x="550" y="410" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#526773">serves retrieval</text>
<rect x="32" y="428" width="166" height="90" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="32" y="428" width="3" height="90" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="44" y="444" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">INPUT</text>
<text x="44" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Researcher asks</text>
<text x="44" y="475" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Bates ID: open the record.</text>
<text x="44" y="487" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Keywords: search directly.</text>
<text x="44" y="499" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Question: use an LLM plan.</text>
<rect x="214" y="428" width="166" height="90" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="214" y="428" width="3" height="90" rx="1" fill="#7451A0" stroke="none" stroke-width=".7"/>
<text x="226" y="444" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#7451A0">ROUTING</text>
<text x="226" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Plan + retrieve</text>
<text x="226" y="475" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Haiku plans question terms and</text>
<text x="226" y="487" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">filters. Embed the query locally</text>
<text x="226" y="499" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">using the same nomic model.</text>
<rect x="396" y="428" width="174" height="90" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="396" y="428" width="3" height="90" rx="1" fill="#235C9D" stroke="none" stroke-width=".7"/>
<text x="408" y="444" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#235C9D">HYBRID SEARCH</text>
<text x="408" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Rank the evidence</text>
<text x="408" y="475" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Filter eligible pages; rank with</text>
<text x="408" y="487" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">OpenSearch BM25 + k-NN.</text>
<text x="408" y="499" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Normalize and blend: 40% keyword</text>
<text x="408" y="511" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">/ 60% semantic.</text>
<rect x="586" y="428" width="174" height="90" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="586" y="428" width="3" height="90" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="598" y="444" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">USER EXPERIENCE</text>
<text x="598" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Results you can check</text>
<text x="598" y="475" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Search: snippets + filters. Ask:</text>
<text x="598" y="487" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">Haiku uses up to 12 excerpts with</text>
<text x="598" y="499" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">checked citation IDs. Verify in the</text>
<text x="598" y="511" font-family="Arial, sans-serif" font-size="9.3" font-weight="400" fill="#526773">scan + OCR viewer.</text>
