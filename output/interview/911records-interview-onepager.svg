<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="8.5in" viewBox="0 0 792 612" role="img" aria-labelledby="title desc">
<title id="title">911records.org: From scanned records to cited answers</title>
<desc id="desc">Flowchart of ingestion, OCR, NLP, embeddings, LLM enrichment, publication, hybrid search and cited answers.</desc>
<rect x="0" y="0" width="792" height="612" rx="0" fill="#FFFFFF" stroke="none" stroke-width=".7"/>
<text x="32" y="29" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#126F70">HENRY WILLIAMS  /  911RECORDS.ORG</text>
<text x="32" y="58" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172B37">From scanned records to cited answers.</text>
<text x="32" y="77" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#526773">An independent research platform for New York City&#x27;s released September 11 records.</text>
<rect x="32" y="91" width="220" height="24" rx="4" fill="#F5F8F8" stroke="none" stroke-width=".7"/>
<text x="42" y="107" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">64,385</text>
<text x="107" y="107" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#526773">PDFs available</text>
<rect x="264" y="91" width="232" height="24" rx="4" fill="#F5F8F8" stroke="none" stroke-width=".7"/>
<text x="274" y="107" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">231,104</text>
<text x="339" y="107" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#526773">catalog pages</text>
<rect x="508" y="91" width="252" height="24" rx="4" fill="#F5F8F8" stroke="none" stroke-width=".7"/>
<text x="518" y="107" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Nightly</text>
<text x="566" y="107" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#526773">catalog refresh + change tracking</text>
<text x="32" y="134" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#126F70">01  /  BUILD THE EVIDENCE LAYER</text>
<rect x="32" y="144" width="160" height="79" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="32" y="144" width="3" height="79" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="44" y="160" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">INGESTION</text>
<text x="44" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">City catalog + PDFs</text>
<text x="44" y="191" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">Snapshot and diff; track changes</text>
<text x="44" y="203" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">and withdrawals. Preserve</text>
<text x="44" y="215" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">source files and Bates page IDs.</text>
<rect x="212" y="144" width="324" height="79" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="212" y="144" width="3" height="79" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="224" y="160" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">OCR  /  LOCAL</text>
<text x="224" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Extract text + recover scans</text>
<text x="224" y="191" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">Embedded text &gt; Tesseract fallback &gt; 300-DPI Apple Vision / Tesseract</text>
<text x="224" y="203" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">comparison. Readability, cross-engine agreement and</text>
<text x="224" y="215" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">number-preservation gates control replacements.</text>
<rect x="556" y="144" width="204" height="79" rx="6" fill="#FFFFFF" stroke="#B9C7CD" stroke-width=".7"/>
<rect x="556" y="144" width="3" height="79" rx="1" fill="#126F70" stroke="none" stroke-width=".7"/>
<text x="568" y="160" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#126F70">PROVENANCE</text>
<text x="568" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#172B37">Selected page text</text>
<text x="568" y="191" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">Use the current catalog copy and approved</text>
<text x="568" y="203" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">OCR. Keep each page linked to its original</text>
<text x="568" y="215" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#526773">scan.</text>
