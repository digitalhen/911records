<text x="32" y="540" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#172B37">EXPERIENCE DEMONSTRATED</text>
<text x="32" y="559" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#235C9D">ML</text>
<text x="66" y="559.0" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">Embedding pipelines, clustering and OCR</text>
<text x="66" y="570.5" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">quality evaluation.</text>
<text x="280" y="559" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#126F70">NLP</text>
<text x="314" y="559.0" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">Information extraction, canonicalization and</text>
<text x="314" y="570.5" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">document classification.</text>
<text x="528" y="559" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#7451A0">LLMs</text>
<text x="562" y="559.0" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">Local inference, structured outputs and</text>
<text x="562" y="570.5" font-family="Arial, sans-serif" font-size="9.2" font-weight="400" fill="#172B37">retrieval-augmented generation.</text>
<polyline points="32,588 760,588" fill="none" stroke="#B9C7CD" stroke-width="0.6"/>
<text x="32" y="601" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#526773">Pretrained models integrated into a production system. Original scans remain the evidence.</text>
<text x="619" y="601" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#526773">Corpus: October 27, 2026</text>
</svg>