# www → apex. The Cloudflare tunnel forwards the original Host header, so this catches every
# www request whatever path it asks for, before the site server below sees it.
server {
  listen 80;
  server_name www.911records.nyc;
  server_tokens off;
  return 301 https://911records.nyc$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  # Set at server level only: an add_header inside a location would replace every header above.
  add_header Cache-Control "public, max-age=300" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location = / { try_files /index.html =404; }
  # Holding page only: every other path returns the page, never a directory listing or stale file.
  location / { try_files /index.html =404; }
}
